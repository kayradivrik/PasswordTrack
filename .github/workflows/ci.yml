name: Build VoidPass (CI/CD)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build libssl-dev libgl1-mesa-dev libvulkan-dev

    - name: Install Qt6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        target: 'desktop'


    - name: Configure and Build
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build

    - name: Upload Linux Build
      uses: actions/upload-artifact@v4
      with:
        name: VoidPass-Linux-Executable
        path: build/VoidPass

  build-windows:
    name: Build for Windows
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Qt6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Install OpenSSL (Windows)
      run: choco install openssl -y

    - name: Configure and Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="C:/Program Files/OpenSSL-Win64"
        cmake --build build --config Release

    - name: Package with windeployqt
      run: |
        mkdir release_package
        cp build/Release/VoidPass.exe release_package/
        windeployqt --qmldir qml release_package/VoidPass.exe
      shell: bash

    - name: Upload Windows Build
      uses: actions/upload-artifact@v4
      with:
        name: VoidPass-Windows-Portable
        path: release_package/
