name: Build VoidPass (CI/CD)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build libssl-dev libgl1-mesa-dev libvulkan-dev

    - name: Install Qt6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        target: 'desktop'


    - name: Configure and Build
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build

    - name: Upload Linux Build
      uses: actions/upload-artifact@v4
      with:
        name: VoidPass-Linux-Executable
        path: build/VoidPass

  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-declarative
          mingw-w64-x86_64-openssl

    - name: Configure and Build
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build

    - name: Package with windeployqt
      run: |
        mkdir release_package
        cp build/VoidPass.exe release_package/
        windeployqt --qmldir qml release_package/VoidPass.exe
        cp /mingw64/bin/libcrypto-3-x64.dll release_package/ || true
        cp /mingw64/bin/libssl-3-x64.dll release_package/ || true

    - name: Upload Windows Build
      uses: actions/upload-artifact@v4
      with:
        name: VoidPass-Windows-Portable
        path: release_package/
