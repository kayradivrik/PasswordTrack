<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; margin: 0; padding: 14px; background: #0a0a0a; color: #fff; font-family: sans-serif; font-size: 13px; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .muted { color: #888; font-size: 12px; }
    .item { display: flex; flex-direction: column; padding: 10px; margin: 6px 0; background: #141414;
            border: 1px solid #262626; border-radius: 6px; cursor: pointer; }
    .item:hover { background: #1f1f1f; }
    input { width: 100%; box-sizing: border-box; padding: 8px; background: #141414; color: #fff;
            border: 1px solid #262626; border-radius: 6px; margin: 6px 0; }
    button { padding: 8px 12px; background: #fff; color: #000; border: 0; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🔐 VoidPass</h1>
  <div id="status" class="muted"></div>
  <div id="list"></div>
  <div id="setup" style="display:none">
    <div class="muted">VoidPass → Ayarlar → Tarayıcı Eklentisi bölümündeki token'ı yapıştırın:</div>
    <input id="token" placeholder="Token">
    <button id="save">Kaydet</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
